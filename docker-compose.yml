name: wps

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wps
      POSTGRES_PASSWORD: wps
      POSTGRES_DB: wps
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wps"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wps-minio
      MINIO_ROOT_PASSWORD: wps-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set wps http://minio:9000 wps-minio wps-minio-secret &&
      mc mb --ignore-existing wps/wps-attachments
      "

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wps:wps@postgres:5432/wps
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/backend
    command: ["pnpm", "db:migrate"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wps:wps@postgres:5432/wps
      MINIO_ENDPOINT: minio
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health/liveness', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_REALTIME_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
